<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ITI-Market{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; color: #333; }

        /* ── Navbar ── */
        nav {
            background: linear-gradient(90deg, #0f0c29, #302b63, #24243e);
            padding: 0 36px;
            display: flex;
            align-items: center;
            height: 62px;
            box-shadow: 0 3px 14px rgba(0,0,0,.35);
            position: sticky; top: 0; z-index: 999;
        }
        .nav-brand {
            font-size: 22px; font-weight: 900; letter-spacing: 1.5px;
            background: linear-gradient(90deg, #f59e0b, #ec4899);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-right: 32px; text-decoration: none;
        }
        nav a {
            color: #c7d2fe;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 6px;
            transition: background .2s, color .2s;
            margin-right: 4px;
        }
        nav a:hover { background: rgba(255,255,255,.12); color: #fff; }

        /* ── Content wrapper ── */
        .container { max-width: 1200px; margin: 36px auto; padding: 0 24px; }

        /* ── Page heading ── */
        .page-title {
            font-size: 28px; font-weight: 800; color: #1e1b4b;
            margin-bottom: 28px; padding-bottom: 12px;
            border-bottom: 3px solid #6366f1;
            display: inline-block;
        }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'products_index' %}" class="nav-brand">&#128187; ITI-Market</a>
        <a href="{% url 'products_index' %}">Products</a>
        <a href="{% url 'about_us' %}">About Us</a>
        <a href="{% url 'signup' %}" style="margin-left:auto; background:linear-gradient(90deg,#f59e0b,#ec4899); color:#fff; padding:7px 18px; border-radius:8px; font-weight:800;">Sign Up</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
