version: '3.8'

services:
  mysql:
    image: mysql:latest
    container_name: my_mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=mysecretpassword
      - MYSQL_DATABASE=my_app_db
  nginx:
    image: nginx:latest
    container_name: my_nginx
    ports:
      - "8080:80"
    depends_on:
      - mysql